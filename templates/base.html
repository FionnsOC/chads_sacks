<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Chad's Sacks{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <nav class="navbar">
            <a class="logo" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Chad's Sacks logo">
            </a>
            <ul>
                {% if session.get("logged_in") %}
                    <li><a href="{{ url_for('how_it_works') }}">How it works</a></li>
                    <li><a href="{{ url_for('calculator') }}">Calculator</a></li>
                    <li><a href="{{ url_for('balances') }}">Balances</a></li>
                    <li><a class="nav-button" href="{{ url_for('logout') }}">Logout</a></li>
                {% else %}
                    <li><a href="{{ url_for('index') }}">The Business</a></li>
                    <li><a href="{{ url_for('contact') }}">Contact</a></li>
                    <li><a class="nav-button" href="{{ url_for('login') }}">Employee Login</a></li>
                {% endif %}
            </ul>
        </nav>

        <div class="hero">
            <h1>Chad's Sacks</h1>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
