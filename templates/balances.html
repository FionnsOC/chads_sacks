{% extends "base.html" %}

{% block title %}Balances{% endblock %}

{% block content %}
    <h2>Balances</h2>
    <table class="calc-table">
        <tr><th>Name</th><th>Money</th></tr>
        {% for row in rows %}
        <tr>
            <td>{{ row.name }}</td>
            <td>{{ row.balance | coins }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
